[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-agent"
version = "0.1.0"
description = "Adaptive supervisor multi-agent sales assistant (LangGraph + FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "anthropic>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "deepeval>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sales_agent*"]

[tool.pytest.ini_options]
testpaths = ["evals"]
addopts = "-q"
